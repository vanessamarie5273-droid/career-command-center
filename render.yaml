# Render Blueprint: web app + managed Postgres + daily 6:00 AM Arizona job.
# Deploy: Render dashboard → New → Blueprint → pick this repo. See SETUP.md.
databases:
  - name: ccc-db
    databaseName: ccc
    user: ccc
    plan: basic-256mb        # paid plan: persistent, daily backups (free Postgres expires)
    region: oregon
    postgresMajorVersion: "16"

envVarGroups:
  - name: ccc-shared
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: ccc-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    # If ADMIN_EMAIL and ADMIN_PASSWORD are set on this service, the login is created/reset on deploy.
    preDeployCommand: npx prisma migrate deploy && npm run db:seed && (test -z "$ADMIN_EMAIL" || test -z "$ADMIN_PASSWORD" || npm run user:create)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: ccc-db, property: connectionString }
      - fromGroup: ccc-shared
      - key: ANTHROPIC_API_KEY # optional: assistant and tailoring suggestions
        sync: false
      - key: RESEND_API_KEY    # optional: email alerts and briefing sent from the app
        sync: false
      - key: ALERT_FROM_EMAIL  # optional: verified sender, e.g. "Command Center <alerts@yourdomain.com>"
        sync: false

  - type: cron
    name: ccc-daily
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 13 * * *"   # 13:00 UTC = 6:00 AM Arizona (no daylight saving)
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npm run job:daily
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: ccc-db, property: connectionString }
      - fromGroup: ccc-shared
      - key: APP_URL           # the web app's address, used for links in the morning email
        sync: false
      - key: RESEND_API_KEY    # optional: sends the morning briefing email
        sync: false
      - key: ALERT_FROM_EMAIL  # optional: verified sender
        sync: false
